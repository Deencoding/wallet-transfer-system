spring:
  application:
    name: wallet-transfer-system
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: wallet-transfer-system
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true

application:
  observability:
    snapshot-interval: ${OBSERVABILITY_SNAPSHOT_INTERVAL:PT15S}
  financial-reconciliation:
    enabled: ${FINANCIAL_RECONCILIATION_ENABLED:true}
    cron: ${FINANCIAL_RECONCILIATION_CRON:0 0 2 * * *}
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:true}
    poll-interval: ${RECONCILIATION_POLL_INTERVAL:PT5S}
  provider:
    simulator-enabled: ${PROVIDER_SIMULATOR_ENABLED:true}
    webhook-secret: ${PROVIDER_WEBHOOK_SECRET}
    webhook-tolerance: ${PROVIDER_WEBHOOK_TOLERANCE:PT5M}
  messaging:
    consumer-enabled: ${KAFKA_CONSUMER_ENABLED:true}
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    topic: ${TRANSFER_EVENTS_TOPIC:wallet.transfer.events.v1}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT1S}
    claim-lease: ${OUTBOX_CLAIM_LEASE:PT1M}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    initial-backoff: ${OUTBOX_INITIAL_BACKOFF:PT1S}
    max-backoff: ${OUTBOX_MAX_BACKOFF:PT5M}
  security:
    audit-pepper: ${SECURITY_AUDIT_PEPPER}
    hardening:
      rate-limiting-enabled: ${RATE_LIMITING_ENABLED:false}
      fail-closed: ${RATE_LIMIT_FAIL_CLOSED:true}
    jwt:
      issuer: ${JWT_ISSUER:wallet-transfer-system}
      access-audience: ${JWT_ACCESS_AUDIENCE:wallet-transfer-api}
      refresh-audience: ${JWT_REFRESH_AUDIENCE:wallet-transfer-refresh}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
      public-key: ${JWT_PUBLIC_KEY:}
      private-key: ${JWT_PRIVATE_KEY:}

server:
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,kafka
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        wallet.transfer.duration: true
        wallet.provider.request.duration: true
        wallet.outbox.publish.duration: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
